<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Sophie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Eén rustige kolom, mobiel eerst, max 520px. Mokka-palet. */
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --sunken:#EFEFEC; --ink:#202420; --accent:#3A2A22; --accent-ink:#F7F5F2;
  --muted:#737873; --line:rgba(32,36,32,0.09); --success:#86593A; --success-soft:rgba(134,89,58,0.12);
  --warning:#C68B40; --warning-soft:rgba(198,139,64,0.14); --danger:#B4543F;
  --shadow:0 1px 2px rgba(32,36,32,.04),0 8px 24px rgba(32,36,32,.05);
  --nav-bg:rgba(247,247,245,0.78); --overlay:rgba(20,18,16,0.32);
  --font:'Geist',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151210; --surface:#1D1916; --sunken:#27221E; --ink:#EEE9E4; --accent:#E8DDD3; --accent-ink:#1A1512;
  --muted:#A09890; --line:rgba(238,233,228,0.09); --success:#C9A07E; --success-soft:rgba(201,160,126,0.15);
  --warning:#DDA762; --warning-soft:rgba(221,167,98,0.15); --danger:#E07E68; --shadow:none;
  --nav-bg:rgba(21,18,16,0.78); --overlay:rgba(0,0,0,0.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151210; --surface:#1D1916; --sunken:#27221E; --ink:#EEE9E4; --accent:#E8DDD3; --accent-ink:#1A1512;
  --muted:#A09890; --line:rgba(238,233,228,0.09); --success:#C9A07E; --success-soft:rgba(201,160,126,0.15);
  --warning:#DDA762; --warning-soft:rgba(221,167,98,0.15); --danger:#E07E68; --shadow:none;
  --nav-bg:rgba(21,18,16,0.78); --overlay:rgba(0,0,0,0.5); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--success);outline-offset:2px;border-radius:8px}
h1{font-size:28px;font-weight:600;letter-spacing:-0.02em;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:600;margin:0;letter-spacing:-0.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-block:20px calc(150px + env(safe-area-inset-bottom,0px))}
.page{display:flex;flex-direction:column;gap:14px}
.page-anim{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid var(--line)}
.card.tap{cursor:pointer}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.label-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:13px;color:var(--success);font-weight:600;margin-bottom:4px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.warn-text{color:var(--warning)} .pos-text{color:var(--success)}
.done-text{color:var(--muted)}
.grow{flex:1;min-width:0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero{display:flex;flex-direction:column;gap:6px;padding:8px 2px 4px}
.hero-num{display:flex;flex-direction:column;gap:8px;padding:10px 2px 6px}
.big-num{font-size:46px;font-weight:600;letter-spacing:-0.035em;line-height:1.05}
.big-num.small-big{font-size:38px}
.mid-num{font-size:26px;font-weight:600;letter-spacing:-0.025em}
.pct{font-size:22px;font-weight:600;color:var(--success);letter-spacing:-0.02em}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar.thin{height:5px}
.bar-fill{height:100%;background:var(--success);border-radius:inherit;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar-fill.warn{background:var(--warning)}
.budget-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.budget-card{text-align:left;gap:6px;padding:14px}
.bc-name{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-left{font-size:18px;font-weight:600;letter-spacing:-0.01em}
.sum-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:2px 0}
.sum-line.total{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;font-weight:600}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.stat-grid.three{grid-template-columns:repeat(3,1fr)}
.stat-grid>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-grid b{font-weight:600;font-size:15.5px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;min-width:0}
.list-btn>span:first-child{display:flex;flex-direction:column;min-width:0}
.li-title{font-weight:500;overflow-wrap:anywhere}
.check-row{display:flex;align-items:center;gap:12px}
.check-row.static{padding:10px 0}
.circle{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--line);border-color:color-mix(in srgb,var(--ink) 22%,transparent);flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .15s}
.circle:active{transform:scale(.9)}
.circle.done{background:var(--success);border-color:var(--success);color:var(--accent-ink)}
.circle.small{width:20px;height:20px}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:7px 13px;border-radius:99px;background:var(--surface);font-size:14px;border:1px solid var(--line);white-space:nowrap}
.pill.now{font-weight:600}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px;max-width:100%}
.seg-btn{padding:6px 12px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg-btn.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:13px;font-weight:500;font-size:15px;transition:opacity .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunken)}
.btn.light{background:var(--accent-ink);color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{padding:15px;font-size:16px;width:100%}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-col{display:flex;flex-direction:column;gap:8px}
.link{color:var(--success);font-weight:500;padding:6px 0;text-align:center}
.link.small{font-size:14px;text-align:left}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field-label{font-size:13px;color:var(--muted);font-weight:500}
.field-label.top-gap{margin-top:6px}
.field-hint{font-size:12px;color:var(--muted)}
.field-error{font-size:13px;color:var(--danger)}
.input{width:100%;min-width:0;background:var(--sunken);border:1px solid transparent;border-radius:12px;padding:10px 12px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.input:focus{border-color:var(--success)}
.money-input{display:flex;align-items:center;background:var(--sunken);border-radius:12px;padding-left:12px;border:1px solid transparent;min-width:0}
.money-input:focus-within{border-color:var(--success)}
.money-input span{color:var(--muted)}
.money-input input{flex:1;min-width:0;background:none;border:0;outline:none;padding:10px 12px 10px 6px;font-size:16px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rows{display:flex;flex-direction:column;gap:12px}
.setup-row,.set-item{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.setup-row:first-child{border-top:0;padding-top:0}
.setup-row-top{display:flex;gap:8px;align-items:center}
.w-amount{width:128px;flex:none}
.set-group{display:flex;flex-direction:column;gap:4px}
.set-item.inactive{opacity:.55}
.set-item-bottom{display:flex;align-items:center;gap:10px}
.day-field{display:flex;align-items:center;gap:6px}
.input.day{width:52px;text-align:center;padding:7px}
.switch{width:46px;height:28px;border-radius:99px;background:var(--sunken);position:relative;flex:none;transition:background .2s;border:1px solid var(--line)}
.switch span{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--success)}
.switch.on span{transform:translateX(18px)}
.summary .sum-line{font-size:15px}
.save-bar{gap:10px}
.check-label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check-label input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none}
.rem-row{padding:10px 0;display:flex;flex-direction:column;gap:8px}
.rem-opts{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.rem-opts label{display:flex;flex-direction:column;gap:3px;min-width:0}
.rem-opts .input{padding:7px 10px;font-size:15px}
.confirm{background:var(--warning-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.reminder{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px 16px}
.reminder p{font-size:14px;opacity:.85}
.banner{background:var(--warning-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;padding:24px 8px}
.pad-y{padding:10px 0}
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head span{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.cal-day{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px}
.cal-day.today{font-weight:700}
.cal-day.sel{background:var(--sunken)}
.dots{display:flex;gap:3px;height:5px}
.dots i,.legend i{width:5px;height:5px;border-radius:50%;display:inline-block}
.dot-ok{background:var(--success)} .dot-plan{background:var(--warning)} .dot-rev{background:var(--muted);opacity:.6}
.legend{display:flex;gap:14px}.legend span{display:flex;align-items:center;gap:5px}
.cal-list{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .goal-line{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.chart .area{fill:var(--success-soft)}
.chart .area-line{fill:none;stroke:var(--success);stroke-width:2;stroke-linejoin:round}
.chart .dot{fill:var(--success)}
.chart .col{fill:var(--success);opacity:.45}
.chart .col.cur{opacity:1}
.chart .col.neg{fill:var(--warning)}
.chart-txt{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:flex;flex-direction:column;gap:5px}
.month-nav{display:flex;align-items:center;justify-content:space-between}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:6px 0}
td{padding:8px 0;border-top:1px solid var(--line)}
.r{text-align:right}
tr.tot td{font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 14px;color:var(--muted);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:11px 0;font-size:16px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;background:var(--sunken);font-size:13.5px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.hist{display:flex;justify-content:space-between;gap:8px;padding:8px 0;font-size:14px}
.tx-summary{background:var(--sunken);border-radius:12px;padding:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.sheet-section{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.inline-form{display:flex;gap:10px}.inline-form .money-input{flex:1}
.ask{display:flex;gap:8px}
.answer{background:var(--sunken);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.proposal{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.prop-title{font-size:18px;font-weight:600}
/* nav, fab, sheet, toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:0;background:var(--nav-bg);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-item{flex:1;max-width:104px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:500;border-radius:10px}
.nav-item.on{color:var(--ink)}
.fab{position:fixed;z-index:21;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:12px 18px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(32,24,18,.22)}
@media (min-width:560px){.fab{right:calc(50% - 260px + 16px)}}
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(100%)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.sheet-body{overflow-y:auto;padding:6px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(134px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 32px));background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14.5px;animation:toastIn .25s;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.error{background:var(--danger);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}}
.toast-btn{font-weight:600;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.pot-row{align-items:flex-start}.pot-goal{display:flex;flex-direction:column;gap:3px;margin-top:6px;max-width:220px}.pot-opts{flex-wrap:wrap}.pad-x{padding:0 4px}
.freq{display:flex;flex-direction:column;gap:3px}.freq .input{padding:8px 30px 8px 10px;font-size:15px}
.boot{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.w-amount{width:110px}.big-num{font-size:40px}.stat-grid.three{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div id="root"><div class="app"><p class="boot">Finance laden…</p></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
